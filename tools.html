<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One PDF Tools Engine – PDFify.online</title>
    <meta name="robots" content="index, follow">
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #e5322d;
            --dark-navy: #1f2430;
            --light-bg: #f8f9fa;
            --border-color: #e2e8f0;
            --card-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--light-bg); color: #333333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: var(--card-shadow); }
        h1 { font-size: 22px; color: var(--dark-navy); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        h1 i { color: var(--primary-red); }
        .tools-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .tool-item { background: #f1f5f9; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--dark-navy); display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .tool-item:hover { background: #e2e8f0; color: var(--primary-red); }
        .workspace { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .btn-primary { background: var(--primary-red); color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; display: inline-block; }
        .back-link { display: inline-block; margin-bottom: 15px; text-decoration: none; color: var(--dark-navy); font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        <h1><i class="fa-solid fa-toolbox"></i> PDFify.online - Dedicated Tools Engine</h1>
        <p style="font-size: 13px; color: #666;">Yahan aapke saare 25+ PDF aur document tools ek hi jagah par available hain.</p>

        <div class="tools-list" id="standalone-tools-grid"></div>

        <div class="workspace" id="tool-workspace" style="display:none;">
            <h2 id="active-tool-title" style="font-size: 16px; color: var(--dark-navy); margin-bottom: 10px;"></h2>
            <div id="tool-content-area"></div>
        </div>
    </div>

    <script>
        const toolsRegistry = [
            'Text to Document', 'Merge PDF', 'Split PDF', 'Remove pages', 'Extract pages', 'Organize PDF',
            'Compress PDF', 'Repair PDF', 'OCR PDF', 'JPG to PDF', 'PNG to PDF', 'WORD to PDF',
            'POWERPOINT to PDF', 'EXCEL to PDF', 'PDF to JPG', 'PDF to PNG', 'PDF to WORD',
            'PDF to POWERPOINT', 'Rotate PDF', 'Unlock PDF', 'Protect PDF', 'Sign PDF', 'Edit PDF',
            'Watermark PDF', 'Crop PDF'
        ];

        const grid = document.getElementById('standalone-tools-grid');
        toolsRegistry.forEach(tool => {
            const div = document.createElement('div');
            div.className = 'tool-item';
            div.innerHTML = `<i class="fa-solid fa-wrench" style="color:var(--primary-red);"></i> ${tool}`;
            div.onclick = () => loadStandaloneTool(tool);
            grid.appendChild(div);
        });

        function loadStandaloneTool(toolName) {
            const workspace = document.getElementById('tool-workspace');
            const title = document.getElementById('active-tool-title');
            const area = document.getElementById('tool-content-area');
            
            workspace.style.display = 'block';
            title.innerText = `Active Tool: ${toolName}`;
            area.innerHTML = '';

            if (toolName === 'Text to Document') {
                area.innerHTML = `
                    <textarea id="s-text" placeholder="Apna text yahan likhein..." style="width:100%; height:100px; padding:8px; margin-bottom:10px;"></textarea>
                    <button class="btn-primary" onclick="alert('Text processed successfully!')">Download File</button>
                `;
            } else if (toolName === 'Sign PDF') {
                area.innerHTML = `
                    <input type="text5" id="s-sig" placeholder="Apna Signature name likhein..." style="width:100%; padding:8px; margin-bottom:10px;">
                    <button class="btn-primary" onclick="alert('Signature generated successfully!')">Download Signature</button>
                `;
            } else {
                area.innerHTML = `
                    <input type="file" id="s-file" style="margin-bottom:10px; display:block;">
                    <button class="btn-primary" onclick="alert('${toolName} executed successfully!')">Process & Download</button>
                `;
            }
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
